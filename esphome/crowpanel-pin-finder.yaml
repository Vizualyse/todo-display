# Pin finder for the CrowPanel 7.0": blinks one candidate GPIO between 0V and 3.3V
# once a second and drives the rest low, and shows which one on screen. Tap to step
# to the next pin. Probe pads with a multimeter (black on a header GND): the pad that
# swings is the GPIO; a steady 3.3V is a supply or pull-up rail.
# Flash crowpanel-todo.yaml again afterwards to get the todo display back.

esphome:
  name: crowpanel-pin-finder
  includes:
    - usb_disable.h
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - script.execute: apply_pin

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [tile_stream]

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret ota_password

display:
  - platform: tile_stream
    id: panel
    # Nothing listens here: the stream never connects and the test screen stays.
    url: "ws://127.0.0.1:1/ws"

font:
  - file: "gfonts://Roboto@700"
    id: big
    size: 96
  - file: "gfonts://Roboto"
    id: small
    size: 28

# Candidates: the microSD slot (GPIO10-13) and the NS4168 amp's I2S lines
# (GPIO17/18/42). No speaker here, so the amp pins are plain outputs.
output:
  - { platform: gpio, id: p10, pin: GPIO10 }
  - { platform: gpio, id: p11, pin: GPIO11 }
  - { platform: gpio, id: p12, pin: GPIO12 }
  - { platform: gpio, id: p13, pin: GPIO13 }
  - { platform: gpio, id: p17, pin: GPIO17 }
  - { platform: gpio, id: p18, pin: GPIO18 }
  - { platform: gpio, id: p42, pin: GPIO42 }
  - platform: ledc
    id: backlight_pwm
    pin: GPIO2
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

globals:
  - id: sel
    type: int
    initial_value: "0"
  - id: level
    type: bool
    initial_value: "false"

interval:
  - interval: 1s
    then:
      - lambda: |-
          output::BinaryOutput *outs[] = {id(p10), id(p11), id(p12), id(p13), id(p17), id(p18), id(p42)};
          id(level) = !id(level);
          outs[id(sel)]->set_state(id(level));

i2c:
  sda: GPIO19
  scl: GPIO20
  frequency: 400kHz
  scan: false

touchscreen:
  - platform: gt911
    id: touch
    display: panel
    address: 0x5D
    update_interval: 50ms
    on_release:
      - lambda: id(sel) = (id(sel) + 1) % 7;
      - script.execute: apply_pin

script:
  - id: apply_pin
    then:
      - lambda: |-
          output::BinaryOutput *outs[] = {id(p10), id(p11), id(p12), id(p13), id(p17), id(p18), id(p42)};
          const char *names[] = {"GPIO10", "GPIO11", "GPIO12", "GPIO13", "GPIO17", "GPIO18", "GPIO42"};
          const char *roles[] = {"microSD CS (expected)", "microSD MOSI / CMD (expected)",
                                 "microSD CLK (expected)", "microSD MISO / DAT0 (expected)",
                                 "Amp DIN (NS4168 data)", "Amp LRCLK (NS4168)", "Amp BCLK (NS4168)"};
          for (int i = 0; i < 7; i++) outs[i]->set_state(false);
          ESP_LOGI("pins", "%s blinking, others LOW", names[id(sel)]);

          auto &it = *id(panel);
          it.fill(Color(20, 60, 140));
          it.print(400, 110, id(small), Color(220, 230, 255), display::TextAlign::CENTER, "Blinking 0V / 3.3V every second:");
          it.print(400, 200, id(big), Color(255, 255, 255), display::TextAlign::CENTER, names[id(sel)]);
          it.print(400, 290, id(small), Color(255, 220, 0), display::TextAlign::CENTER, roles[id(sel)]);
          it.print(400, 380, id(small), Color(220, 230, 255), display::TextAlign::CENTER,
                   "Other candidates held at 0V; steady 3.3V = power. Tap for next.");
          it.printf(400, 430, id(small), Color(160, 180, 220), display::TextAlign::CENTER, "%d / 7", id(sel) + 1);
