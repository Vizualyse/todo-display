# Hardware smoke test for the CrowPanel 7.0": plays a constant tone through the on-board
# NS4168 I2S amp (speaker connector) and draws a test screen. Tap to draw a dot.
# Flash crowpanel-todo.yaml again afterwards to get the todo display back.

esphome:
  name: crowpanel-audio-test
  includes:
    - usb_disable.h
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - lambda: id(draw_screen)->execute();
      - rtttl.play: !lambda return id(tune);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [tile_stream]

logger:
  level: DEBUG
  hardware_uart: UART0

# Wi-Fi only so the WebSocket client has a network stack; OTA lets you flash the
# todo firmware back without a cable.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret ota_password

display:
  - platform: tile_stream
    id: panel
    # Nothing listens here: the stream never connects and the test screen stays.
    url: "ws://127.0.0.1:1/ws"

font:
  - file: "gfonts://Roboto@700"
    id: big
    size: 64
  - file: "gfonts://Roboto"
    id: small
    size: 28

# NS4168 amp: BCLK GPIO42, LRCLK GPIO18, data GPIO17 (original 7.0", not "Advance").
i2s_audio:
  i2s_lrclk_pin: GPIO18
  i2s_bclk_pin: GPIO42

speaker:
  - platform: i2s_audio
    id: spk
    dac_type: external
    i2s_dout_pin: GPIO17
    channel: mono

rtttl:
  id: player
  speaker: spk
  gain: 1.0
  # Loop forever: a constant tone.
  on_finished_playback:
    - rtttl.play: !lambda return id(tune);

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO2
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

globals:
  - id: tune
    type: std::string
    # One 440Hz whole note, 8s long at 30bpm; replayed when it ends.
    initial_value: '"tone:d=1,o=5,b=30:a"'

i2c:
  sda: GPIO19
  scl: GPIO20
  frequency: 400kHz
  scan: false

touchscreen:
  - platform: gt911
    id: touch
    display: panel
    address: 0x5D
    update_interval: 50ms
    on_touch:
      - lambda: |-
          id(panel).filled_circle(touch.x, touch.y, 12, Color(255, 220, 0));

script:
  - id: draw_screen
    then:
      - lambda: |-
          auto &it = *id(panel);
          it.fill(Color(20, 60, 140));
          // Colour bars along the bottom: red, green, blue, white.
          const Color bars[] = {Color(255, 0, 0), Color(0, 255, 0), Color(0, 0, 255), Color(255, 255, 255)};
          for (int i = 0; i < 4; i++) it.filled_rectangle(i * 200, 400, 200, 80, bars[i]);
          it.print(400, 150, id(big), Color(255, 255, 255), display::TextAlign::CENTER, "CrowPanel OK");
          it.print(400, 250, id(small), Color(220, 230, 255), display::TextAlign::CENTER,
                   "Playing a constant 440Hz tone. Tap to draw a dot.");
