# Elecrow CrowPanel 7.0" (ESP32-S3-WROOM-1-N4R8, 800x480 RGB, GT911 touch)
# Shows the ToDo add-on's page, streamed as JPEG tiles over a WebSocket.

substitutions:
  name: crowpanel-todo
  # Hard-coded display secret: must match `display_secret` in the add-on options.
  display_key: "change-me"
  # Lowest latency: talk to the add-on directly on the LAN (plain ws://, port 8099).
  # Use Home Assistant's IP address; .local names may not resolve from the stream client.
  stream_url: "ws://192.168.1.10:8099/ws?key=${display_key}"
  # Through the public hostname instead (TLS, adds a little latency, works off-LAN):
  # stream_url: "wss://todo.vizualyse.uk/ws?key=${display_key}"

esphome:
  name: ${name}
  friendly_name: CrowPanel ToDo
  includes:
    - usb_disable.h
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # Run code/rodata from PSRAM so flash writes (OTA) don't stall the panel.
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      # GPIO19/20 carry I2C (touch) on this board; don't let the console claim them
      # as USB. usb_disable.h releases the pins themselves.
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [tile_stream]

logger:
  level: DEBUG
  # The board's USB socket is a CH340 bridge on UART0, not the S3's native USB.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Power save adds 100ms+ of radio wake-up latency to every touch and frame.
  power_save_mode: none

display:
  - platform: tile_stream
    id: panel
    url: ${stream_url}
    # Pins, timings and 15MHz PCLK default to the CrowPanel 7.0"; override here if needed.

i2c:
  sda: GPIO19
  scl: GPIO20
  frequency: 400kHz
  scan: false

touchscreen:
  - platform: gt911
    id: touch
    display: panel
    # GPIO38 is the GT911 INT/address strap; leave it alone and poll instead.
    # Some units strap to 0x14 instead; try that if touch stays silent.
    address: 0x5D
    update_interval: 50ms
    on_touch:
      - lambda: id(panel).send_touch(touch.x, touch.y);

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO2
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: template
    name: Stream connected
    entity_category: diagnostic
    lambda: return id(panel).is_stream_connected();
