# Elecrow CrowPanel 7.0" (ESP32-S3-WROOM-1-N4R8, 800x480 RGB, GT911 touch)
# Shows the ToDo add-on's page, streamed as JPEG tiles over a WebSocket.

substitutions:
  name: crowpanel-todo
  # Must match `display_secret` in the add-on options; kept in secrets.yaml (gitignored).
  display_key: !secret display_key
  # Lowest latency: talk to the add-on directly on the LAN (plain ws://, port 8099).
  # Use Home Assistant's IP address; .local names may not resolve from the stream client.
  stream_url: "ws://192.168.8.173:8099/ws?key=${display_key}"
  # Through the public hostname instead (TLS, adds a little latency, works off-LAN):
  # stream_url: "wss://todo.vizualyse.uk/ws?key=${display_key}"
  # Backlight turns off after this long without a touch; a tap wakes it.
  screen_timeout: 30s
  # With "Reply on Alexa" on, voice replies play on this Music Assistant player instead.
  alexa_player: media_player.kitchen_dot
  # How long after the panel's (silent) reply to wait before listening again.
  alexa_reply_lag: 5s

esphome:
  name: ${name}
  friendly_name: CrowPanel ToDo
  includes:
    - usb_disable.h
    - chimes.h
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    # Late, so the speaker is set up before it's started.
    priority: -100
    then:
      - script.execute: screen_idle
      # Keep the sound-effects speaker running (silent) so a click plays at once
      # instead of being lost while the I2S driver starts.
      - lambda: |-
          id(fx_spk).set_audio_stream_info(chimes::stream_info());
          id(fx_spk).start();
          id(panel).set_volume_getter([]() { return id(music).volume; });

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # Run code/rodata from PSRAM so flash writes (OTA) don't stall the panel.
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      # GPIO19/20 carry I2C (touch) on this board; don't let the console claim them
      # as USB. usb_disable.h releases the pins themselves.
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [tile_stream]

logger:
  level: DEBUG
  # The board's USB socket is a CH340 bridge on UART0, not the S3's native USB.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Power save adds 100ms+ of radio wake-up latency to every touch and frame.
  power_save_mode: none

display:
  - platform: tile_stream
    id: panel
    url: ${stream_url}
    # Pins, timings and 15MHz PCLK default to the CrowPanel 7.0"; override here if needed.
    # The heart menu's volume is the panel's master volume: the music player's, which
    # the mixer applies to the amp, so it scales clicks, chimes and music alike.
    on_volume:
      - lambda: id(music).make_call().set_volume(volume).perform();
    # The page asks for a click when a tap hits a button (mute in the heart menu); the
    # add-on asks for a chime when a todo's alarm is due. See chimes.h.
    on_sound:
      - lambda: |-
          if (!chimes::play(id(fx_spk), sound, volume))
            ESP_LOGW("sound", "Unknown sound '%s'", sound.c_str());
      # Anything but a click is an alarm: light the screen so the todo can be seen.
      - if:
          condition:
            lambda: return sound != "click";
          then:
            - light.turn_on: { id: backlight, transition_length: 0s }
            - script.execute: screen_idle

i2c:
  sda: GPIO19
  scl: GPIO20
  frequency: 400kHz
  scan: false

touchscreen:
  - platform: gt911
    id: touch
    display: panel
    # GPIO38 is the GT911 INT/address strap; leave it alone and poll instead.
    # Some units strap to 0x14 instead; try that if touch stays silent.
    address: 0x5D
    update_interval: 50ms
    # A touch while the screen is off only wakes it: the whole gesture is swallowed,
    # so the waking tap can't tick whatever todo is under the finger.
    on_touch:
      - if:
          condition:
            lambda: return !id(backlight).remote_values.is_on();
          then:
            - globals.set: { id: swallow_touch, value: "true" }
            - light.turn_on: { id: backlight, transition_length: 0s }
          else:
            # A tap while a finished timer rings only silences it.
            - if:
                condition:
                  script.is_running: timer_ring
                then:
                  - script.stop: timer_ring
                  - globals.set: { id: swallow_touch, value: "true" }
                else:
                  - lambda: id(panel).touch_down(touch.x, touch.y);
      - script.execute: screen_idle
    on_update:
      - lambda: |-
          if (!id(swallow_touch) && !touches.empty())
            id(panel).touch_move(touches[0].x, touches[0].y);
      - script.execute: screen_idle
    on_release:
      - lambda: |-
          if (id(swallow_touch)) id(swallow_touch) = false;
          else id(panel).touch_up();
      - script.execute: screen_idle

globals:
  - id: swallow_touch
    type: bool
    initial_value: "false"

script:
  # Restarted by every touch; turns the backlight off once it runs out.
  - id: screen_idle
    mode: restart
    then:
      - delay: ${screen_timeout}
      - light.turn_off: { id: backlight, transition_length: 1s }
  # A finished voice timer: ring until tapped, for up to about half a minute.
  - id: timer_ring
    mode: restart
    then:
      - light.turn_on: { id: backlight, transition_length: 0s }
      - repeat:
          count: 12
          then:
            - lambda: chimes::play(id(fx_spk), "bell", 1.0f);
            - delay: 2500ms

# NS4168 I2S amp on the speaker socket. A mixer shares it between sound effects
# (clicks, alarm chimes), music and voice replies, all at 48kHz so nothing needs
# resampling. The mic (INMP441, soldered to the microSD pads) has its own bus, so it
# isn't tied to the always-running speaker.
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO18
    i2s_bclk_pin: GPIO42
  - id: i2s_in
    i2s_lrclk_pin: GPIO11
    # Bridged to GPIO13 on our unit: keep 13 an undriven input (no SD card).
    i2s_bclk_pin: GPIO12

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO10
    adc_type: external
    # L/R tied to GND.
    channel: left
    # 24-bit samples in 32-bit slots.
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: amp
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO17
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit
    timeout: never
  - platform: mixer
    id: amp_mixer
    output_speaker: amp
    task_stack_in_psram: true
    source_speakers:
      - id: fx_spk
        timeout: never
        # Room for a whole alarm chime (up to 1.75s), queued in one go.
        buffer_duration: 2s
      - id: music_spk
      - id: announce_spk

# Music from Music Assistant over Sendspin. HA hands the device to Music Assistant,
# which lists it as a player (and as a Spotify Connect target if enabled there).
sendspin:
  task_stack_in_psram: true

media_source:
  - platform: sendspin
    id: sendspin_source
    task_stack_in_psram: true
    # The amp is mono; a lower rate isn't worth it (Opus needs 48kHz anyway).
    sample_rate: 48000
  # Voice assistant replies (TTS) and other HA announcements, fetched by URL.
  - platform: audio_http
    id: announce_http
    task_stack_in_psram: true

media_player:
  - platform: speaker_source
    id: music
    name: Music
    volume_initial: 40%
    # Report every change (page, Music Assistant, Spotify) so both sliders follow.
    on_volume:
      - lambda: id(panel).send_volume(id(music).volume);
    media_pipeline:
      speaker: music_spk
      sources:
        - sendspin_source
      num_channels: 1
    # HA transcodes announcements to this format, so the mixer gets 48kHz mono.
    announcement_pipeline:
      speaker: announce_spk
      sources:
        - announce_http
      format: FLAC
      sample_rate: 48000
      num_channels: 1

# Home Assistant voice: "Okay Nabu" is detected on the panel, then the speech goes to
# HA's Assist pipeline and the reply plays through the media player, or on the Echos
# when "Reply on Alexa" is on.
micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    gain_factor: 4
  task_stack_in_psram: true
  models:
    - model: okay_nabu
    # Trained locally with microWakeWord (wake_words/training/). Tune
    # `probability_cutoff` in its JSON if it misses (lower) or wakes on its own
    # (higher). HA's "Wake word" selects decide which models actually run.
    - model: wake_words/hey_ned.json
      id: hey_ned
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    # Light the screen so a reply can be read too.
    - light.turn_on: { id: backlight, transition_length: 0s }

voice_assistant:
  id: va
  microphone:
    microphone: mic
    gain_factor: 4
  micro_wake_word: mww
  media_player: music
  noise_suppression_level: 2
  auto_gain: 31dBFS
  # Listen for the wake word only while HA is connected to take the request.
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  # Voice timers ("set a timer for 10 minutes") run in HA; a handler here tells HA the
  # panel supports them.
  on_timer_finished:
    - script.execute: timer_ring
  # Replying on the Echos: the voice assistant can't skip its own media player, so the
  # panel still plays the reply (which keeps its state machine and timing intact) but
  # with the announcement source ducked as far as the mixer goes (50dB, near silent).
  on_start:
    - if:
        condition:
          switch.is_on: reply_on_alexa
        then:
          - mixer_speaker.apply_ducking: { id: announce_spk, decibel_reduction: 50 }
  # Music Assistant plays it on the Echo (and the Echos grouped with it in the Alexa
  # app). Needs "Allow the device to perform Home Assistant actions" in HA.
  on_tts_end:
    - if:
        condition:
          switch.is_on: reply_on_alexa
        then:
          - homeassistant.action:
              action: music_assistant.play_announcement
              data:
                entity_id: ${alexa_player}
                url: !lambda return x;
                use_pre_announce: "false"
  # The wake word stops after a detection; listen again once the request is done.
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    # The Echos start a few seconds behind the panel; don't let "Okay Nabu" or the
    # reply itself, coming back from them, start another request.
    - if:
        condition:
          switch.is_on: reply_on_alexa
        then:
          - delay: ${alexa_reply_lag}
    - mixer_speaker.apply_ducking: { id: announce_spk, decibel_reduction: 0 }
    - micro_wake_word.start:

switch:
  - platform: template
    id: reply_on_alexa
    name: Reply on Alexa
    icon: mdi:speaker-message
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO2
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    # However it was turned on (touch, chime, or HA), time it out again.
    on_turn_on:
      - script.execute: screen_idle

binary_sensor:
  - platform: template
    name: Stream connected
    entity_category: diagnostic
    lambda: return id(panel).is_stream_connected();
