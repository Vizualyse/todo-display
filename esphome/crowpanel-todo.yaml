# Elecrow CrowPanel 7.0" (ESP32-S3-WROOM-1-N4R8, 800x480 RGB, GT911 touch)
# Shows the ToDo add-on's page, streamed as JPEG tiles over a WebSocket.

substitutions:
  name: crowpanel-todo
  # Must match `display_secret` in the add-on options; kept in secrets.yaml (gitignored).
  display_key: !secret display_key
  # Lowest latency: talk to the add-on directly on the LAN (plain ws://, port 8099).
  # Use Home Assistant's IP address; .local names may not resolve from the stream client.
  stream_url: "ws://192.168.8.173:8099/ws?key=${display_key}"
  # Through the public hostname instead (TLS, adds a little latency, works off-LAN):
  # stream_url: "wss://todo.vizualyse.uk/ws?key=${display_key}"
  # Backlight turns off after this long without a touch; a tap wakes it.
  screen_timeout: 30s

esphome:
  name: ${name}
  friendly_name: CrowPanel ToDo
  includes:
    - usb_disable.h
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    # Late, so the speaker is set up before it's started.
    priority: -100
    then:
      - script.execute: screen_idle
      # Keep the speaker running (silent) so a click plays at once instead of being
      # lost while the I2S driver starts.
      - lambda: id(spk).start();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # Run code/rodata from PSRAM so flash writes (OTA) don't stall the panel.
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      # GPIO19/20 carry I2C (touch) on this board; don't let the console claim them
      # as USB. usb_disable.h releases the pins themselves.
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [tile_stream]

logger:
  level: DEBUG
  # The board's USB socket is a CH340 bridge on UART0, not the S3's native USB.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Power save adds 100ms+ of radio wake-up latency to every touch and frame.
  power_save_mode: none

display:
  - platform: tile_stream
    id: panel
    url: ${stream_url}
    # Pins, timings and 15MHz PCLK default to the CrowPanel 7.0"; override here if needed.
    # The page asks for a click when a tap hits a button (muted from the heart menu).
    on_sound:
      - if:
          condition:
            lambda: return sound == "click";
          then:
            - lambda: |-
                // 8ms 2.5kHz tick with a fast decay, 16kHz 16-bit mono.
                static std::vector<int16_t> pcm = [] {
                  std::vector<int16_t> v(128);
                  for (size_t i = 0; i < v.size(); i++)
                    v[i] = 9000 * expf(-float(i) / 24) * sinf(2 * M_PI * 2500 * i / 16000);
                  return v;
                }();
                id(spk).play(reinterpret_cast<const uint8_t *>(pcm.data()), pcm.size() * 2);

i2c:
  sda: GPIO19
  scl: GPIO20
  frequency: 400kHz
  scan: false

touchscreen:
  - platform: gt911
    id: touch
    display: panel
    # GPIO38 is the GT911 INT/address strap; leave it alone and poll instead.
    # Some units strap to 0x14 instead; try that if touch stays silent.
    address: 0x5D
    update_interval: 50ms
    # A touch while the screen is off only wakes it: the whole gesture is swallowed,
    # so the waking tap can't tick whatever todo is under the finger.
    on_touch:
      - if:
          condition:
            lambda: return !id(backlight).remote_values.is_on();
          then:
            - globals.set: { id: swallow_touch, value: "true" }
            - light.turn_on: { id: backlight, transition_length: 0s }
          else:
            - lambda: id(panel).touch_down(touch.x, touch.y);
      - script.execute: screen_idle
    on_update:
      - lambda: |-
          if (!id(swallow_touch) && !touches.empty())
            id(panel).touch_move(touches[0].x, touches[0].y);
      - script.execute: screen_idle
    on_release:
      - lambda: |-
          if (id(swallow_touch)) id(swallow_touch) = false;
          else id(panel).touch_up();
      - script.execute: screen_idle

globals:
  - id: swallow_touch
    type: bool
    initial_value: "false"

script:
  # Restarted by every touch; turns the backlight off once it runs out.
  - id: screen_idle
    mode: restart
    then:
      - delay: ${screen_timeout}
      - light.turn_off: { id: backlight, transition_length: 1s }

# NS4168 I2S amp on the speaker socket.
i2s_audio:
  i2s_lrclk_pin: GPIO18
  i2s_bclk_pin: GPIO42

speaker:
  - platform: i2s_audio
    id: spk
    dac_type: external
    i2s_dout_pin: GPIO17
    channel: mono
    timeout: never

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO2
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: template
    name: Stream connected
    entity_category: diagnostic
    lambda: return id(panel).is_stream_connected();
